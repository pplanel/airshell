name: Publish Binary Cache

# Builds this flake's aarch64-darwin outputs (airshell-proxy, airshell-connect) and
# pushes the signed NARs to ghcr.io/<owner>/<repo>/nix-cache. The build logic lives
# once in pplanel/nixcache as a reusable workflow; this is just the thin caller.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: pplanel/nixcache/.github/workflows/publish-cache.yml@main
    secrets: inherit
    with:
      # airshell's flake build is impure (__noChroot + Xcode's clang/swift/SDK,
      # see flake.nix): it only works on a Mac with Xcode installed and Nix's
      # sandbox off — which GitHub-hosted macos runners don't provide. Build on
      # a self-hosted Apple-Silicon runner set up like the dev Macs, tagged with
      # the `airshell-builder` label. See docs/self-hosted-cache-runner.md.
      runs-on: airshell-builder
